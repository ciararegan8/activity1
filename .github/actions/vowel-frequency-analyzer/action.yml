name: Vowel Frequency Analyzer
description: Analyses vowel frequencies in a text file and updates README.md

inputs:
  file:
    description: Path to the text file to analyse
    required: true
    default: data.txt

runs:
  using: docker
  image: docker://ghcr.io/ciararegan8/vowel-frequency-analyzer:latest
  env:
    FILE: ${{ inputs.file }}
